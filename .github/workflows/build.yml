name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: terminal-os-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Terminal OS build ${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
          body: |
            Terminal OS by Elganya — build automatique ${{ github.run_number }}.
            Installe l'APK, autorise "installer des applications inconnues" pour ton navigateur.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

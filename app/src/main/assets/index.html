<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0810">
<title>Terminal OS by Elganya</title>
<link rel="stylesheet" href="css/theme.css">
</head>
<body>

<div class="boot" id="boot">
  <div class="mark">
    <div class="logo">&gt;_</div>
    <div class="name">Terminal OS</div>
    <div class="bar"><i></i></div>
  </div>
</div>

<div class="shell" id="shell" hidden>
  <aside class="rail" id="rail">
    <div class="brand">
      <div class="logo">&gt;_</div>
      <div class="txt"><strong>Terminal OS</strong><span>by Elganya</span></div>
    </div>
    <nav id="nav"></nav>
    <div class="spacer"></div>
    <div class="foot">
      <span><b id="footEngine">—</b><br>moteur actif</span>
      <button class="iconbtn" id="footSettings" title="Paramètres"></button>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <main class="main">
    <header class="topbar">
      <button class="iconbtn burger" id="burger" aria-label="Menu"></button>
      <div>
        <div class="crumb" id="crumb">Terminal OS</div>
        <h1 id="pageTitle">Cockpit</h1>
      </div>
      <div class="actions" id="pageActions"></div>
    </header>
    <div class="viewport" id="view"></div>
    <nav class="tabbar" id="tabbar"></nav>
  </main>
</div>

<div class="sheet" id="sheet">
  <div class="bg" data-close="1"></div>
  <div class="panel" id="sheetPanel"></div>
</div>

<div class="toast" id="toast"></div>

<script src="js/core.js"></script>
<script src="js/screens1.js"></script>
<script src="js/screens2.js"></script>
<script src="js/screens3.js"></script>
<script src="js/app.js"></script>
</body>
</html>
